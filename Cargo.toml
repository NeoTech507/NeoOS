[workspace]
resolver = "3"
members = ["kernel"]
default-members = ["."]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package]
name = "neoos"
version = "0.1.0"
edition = "2024"

[build-dependencies]
bootloader = "0.11.17"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
